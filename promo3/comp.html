<!DOCTYPE html>
<!-- Rungkai Kusut · "Cahaya imbasan" — practical AI promo, 1080×1920 TikTok / Reels. onetake method (motion.js, PolyForm NC). -->
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Rungkai Kusut · Cahaya imbasan</title>
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0E2A27}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="motion.js"></script>
<script>
'use strict';
const { clamp, lerp, seg, sstep, ssstep, ease, spring, spline } = OM;
const W = 1080, H = 1920, DUR = 21.5;
const SAFE = { x0: 72, x1: 930, y0: 250, y1: 1440 };   // TikTok + Reels shared safe zone
const CX = (SAFE.x0 + SAFE.x1) / 2;
const C = {
  ground: '#0E2A27', ground2: '#133A35', dot: '#21504A', cream: '#F4EFE5', paper: '#FBF8F2', card: '#FFFFFF',
  ink: '#1B2A4A', deep: '#0E2A27', mute: '#5D6782', soft: '#9FC7BE', line: '#E6E0D3', grey: '#D9D3C7',
  mint: '#7FD8B0', teal: '#1E7A6C', tealL: '#E1F1EE', amber: '#F2B544', amberL: '#FDF1D6', pink: '#E46F92', pinkD: '#C2456B',
  beam: '#7fd8b1',   // the scan light: the one thing that survives every boundary
};
const F = { sans: (w, px) => `${w} ${px}px Jakarta`, serif: px => `400 ${px}px Serif`, ital: px => `italic 400 ${px}px Serif` };
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const DPR = window.devicePixelRatio || 1; cv.width = W * DPR; cv.height = H * DPR;

// ───────────────────────── timeline ─────────────────────────
const T = {
  h1: 0.1, h2: 0.4, cnt: 0.7, beamIn: 2.15, scan: 2.6, scanned: 3.55, head2: 2.7,
  rapid: 3.7, rapidEnd: 5.15, toChat: 5.3, inChat: 6.05, chatHead: 5.9,
  type1: 6.2, send1: 6.95, dots1: 7.05, ans1: 7.5, type2: 8.0, send2: 8.4, dots2: 8.45, ans2: 8.85, restA: 9.15,
  dive: 9.9, dived: 10.7, fcHead: 10.25, sweep: 10.8, swept: 12.4, warn: 12.0,
  toD: 12.85, inD: 13.45, cards: [13.45, 13.75, 14.05, 14.35], dHead: 13.0,
  cta: 14.75, ctaHead: 14.85, tap: 16.55, zoom: 16.75, filled: 17.45, end: 17.5,
};
const B = 2000, D = 4000;   // world offsets of the chat and the AI-cards sections
// section A: the pile of invoices
const INV = { x: 181, y: 600, w: 640, h: 800 };
const PILE = Array.from({ length: 7 }, (_, i) => { const r = OM.rng(11 + i * 7); return { dx: (r() - 0.5) * 70, dy: -i * 9 + (r() - 0.5) * 20, rot: (r() - 0.5) * 0.16, t: 0.08 + (6 - i) * 0.17 }; });
const FIELDS = [   // where the beam reads (local y in the invoice)
  { y: 170, h: 46, x: 40, w: 470, label: 'Pembekal' }, { y: 236, h: 40, x: 40, w: 300, label: 'No. invois' },
  { y: 236, h: 40, x: 380, w: 220, label: 'Tarikh' }, { y: 640, h: 60, x: 300, w: 300, label: 'Jumlah' },
];
// section B: chat card + the mini chart that the camera dives into
const CHAT = { x: 90, y: B + 560, w: 822, h: 880 };
const INPUT = { x: 120, y: B + 1340, w: 762, h: 76 };
const CR = { x: 150, y: B + 935, w: 330, h: 190 }, CL = { w: 858, h: 494 }, CS = CR.w / CL.w;   // chart: local units 858×494
const ZOOM_C = 1 / CS, CAM_C = { x: CR.x + CR.w / 2 + (540 - CX) / ZOOM_C, y: CR.y + CR.h / 2 };
const MONTHS = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
const SALES = [42, 48, 45, 55, 60, 57, 66, 72], FCAST = [72, 78, 83, 90, 97];   // FCAST[0] = today
const mx = i => 60 + i * (CL.w - 100) / 11, my = v => CL.h - 70 - v / 110 * (CL.h - 130);
// section D: four capability cards slam onto the beam, then the top one becomes the CTA
const SHELF_Y = D + 1180;
const AICARDS = ['Baca invois & borang', 'Chatbot data syarikat', 'Ramalan jualan & stok', 'Laporan automatik'];
const CTA = { x: 90, y: D + 600, w: 822, h: 760 };
const BTN = { x: 130, y: D + 1220, w: 742, h: 100 };

// ───────────────────────── the beam (a polyline, so it can be a line, a caret, a frame) ─────────────────────────
const N = 120;
const lineP = (x0, y0, x1, y1) => Array.from({ length: N }, (_, i) => [lerp(x0, x1, i / (N - 1)), lerp(y0, y1, i / (N - 1))]);
function rectP(r) {   // perimeter of a rounded-ish rect, evenly in N points
  const per = 2 * (r.w + r.h), out = [];
  for (let i = 0; i < N; i++) {
    let d = per * i / (N - 1);
    if (d < r.w) out.push([r.x + d, r.y]); else if ((d -= r.w) < r.h) out.push([r.x + r.w, r.y + d]);
    else if ((d -= r.h) < r.w) out.push([r.x + r.w - d, r.y + r.h]); else { d -= r.w; out.push([r.x, r.y + r.h - Math.min(d, r.h)]); }
  }
  return out;
}
const mixP = (A, Bp, k) => A.map((p, i) => [lerp(p[0], Bp[i][0], k), lerp(p[1], Bp[i][1], k)]);
const chartToWorld = (lx, ly) => [CR.x + lx * CS, CR.y + ly * CS];
function scanY(t) {   // where the beam sits on the invoice pile
  if (t < T.scan) return INV.y + 40;
  if (t < T.scanned) return lerp(INV.y + 40, INV.y + INV.h - 40, ease.sineInOut(seg(t, T.scan, T.scanned)));
  if (t < T.rapid) return lerp(INV.y + INV.h - 40, INV.y + 40, ease.expoInOut(seg(t, T.scanned, T.rapid)));
  if (t < T.rapidEnd) { const per = (T.rapidEnd - T.rapid) / 5, u = ((t - T.rapid) % per) / per; return lerp(INV.y + 40, INV.y + INV.h - 40, ease.cubicInOut(u)); }
  return INV.y + INV.h / 2;
}
function beamAt(t) {
  const inv = () => lineP(INV.x - 30, scanY(t), INV.x + INV.w + 30, scanY(t));
  if (t < T.toChat) {
    const w = ease.expoOut(seg(t, T.beamIn, T.beamIn + 0.4)), P = inv(), c = INV.x + INV.w / 2;
    return { P: P.map(p => [lerp(c, p[0], w), p[1]]), op: sstep(T.beamIn, T.beamIn + 0.1, t) };
  }
  const inLine = lineP(INPUT.x + 10, INPUT.y + INPUT.h + 4, INPUT.x + INPUT.w - 10, INPUT.y + INPUT.h + 4);
  if (t < T.dive) {
    const k = ease.expoInOut(seg(t, T.toChat, T.inChat));
    return { P: mixP(lineP(INV.x - 30, INV.y + INV.h / 2, INV.x + INV.w + 30, INV.y + INV.h / 2), inLine, k), op: 1 };
  }
  // the beam stands up as the chart's "hari ini" line, then sweeps into the future
  const bx = lerp(mx(7), mx(11) + 20, ease.cubicInOut(seg(t, T.sweep, T.swept)));
  const [ax, ay] = chartToWorld(bx, 30), [bx2, by2] = chartToWorld(bx, CL.h - 60), vline = lineP(ax, ay, bx2, by2);
  if (t < T.toD) return { P: mixP(inLine, vline, ease.expoInOut(seg(t, T.dive, T.dived))), op: 1, chartX: bx };
  const shelf = lineP(110, SHELF_Y, 890, SHELF_Y);
  if (t < T.cta) return { P: mixP(vline, shelf, ease.expoInOut(seg(t, T.toD, T.inD))), op: 1 };
  // the shelf becomes the glowing outline of the button
  const frame = rectP({ x: BTN.x - 8, y: BTN.y - 8, w: BTN.w + 16, h: BTN.h + 16 });
  if (t < T.end) return { P: mixP(shelf, frame, ease.expoInOut(seg(t, T.cta + 0.4, T.cta + 1.2))), op: 1 - sstep(T.zoom + 0.3, T.filled, t) };
  return null;
}

// ───────────────────────── camera ─────────────────────────
const KEYS = [
  { t: 0, x: 540, y: 990, zoom: 1.04 },
  { t: 2.3, x: 540, y: 975, zoom: 1.0, curve: ease.sineInOut },
  { t: 3.6, x: 540, y: 975, zoom: 1.0 },
  { t: 3.75, x: 540, y: 990, zoom: 1.05, curve: ease.expoOut },          // leans in for the rapid scans
  { t: 5.2, x: 540, y: 990, zoom: 1.05 },
  { t: T.inChat, x: 540, y: B + 960, zoom: 1.0, curve: ease.expoInOut }, // dives with the beam
  { t: T.dive, x: 540, y: B + 960, zoom: 1.0 },
  { t: T.dived, x: CAM_C.x, y: CAM_C.y, zoom: ZOOM_C, curve: ease.expoInOut },   // into the chart in the bubble
  { t: T.toD, x: CAM_C.x, y: CAM_C.y, zoom: ZOOM_C },
  { t: T.inD, x: 540, y: D + 960, zoom: 1.0, curve: ease.expoInOut },
  { t: T.zoom, x: 540, y: D + 960, zoom: 1.0 },
  { t: T.filled, x: BTN.x + BTN.w / 2 + (540 - CX) / 9, y: BTN.y + BTN.h / 2, zoom: 9, curve: ease.expoIn },   // through the button
];
const HITS = [[0.25, 5, 10], [0.6, 5, 10], [0.95, 6, 9], [3.55, 4, 10], [5.15, 6, 9], [7.5, 4, 10], [12.0, 5, 10], ...[13.45, 13.75, 14.05, 14.35].map((t, i) => [t, 8 + i * 2, 9]), [16.55, 4, 10]];
const handEnv = t => sstep(1.4, 1.8, t) * (1 - sstep(2.4, 2.7, t)) + sstep(6.2, 6.5, t) * (1 - sstep(8.9, 9.15, t));
function camAt(t) {
  const c = OM.camera(t, KEYS, { W, H }), e = handEnv(t) * 4;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom, y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom, rot = c.rot;
  for (const [th, amp, decay] of HITS) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  return { x, y, zoom: c.zoom, rot };
}

// ───────────────────────── finger ─────────────────────────
const FING = [{ t: 15.9, x: 1000, y: D + 1560 }, { t: T.tap, x: CX + 140, y: BTN.y + 52 }, { t: 17.0, x: CX + 140, y: BTN.y + 52 }];
function finger(t) {
  if (t < 15.9 || t > 17.0) return null;
  const p = spline(FING, t);
  return { x: p[0], y: p[1], op: sstep(15.9, 16.1, t) * (1 - sstep(16.7, 16.95, t)), down: sstep(T.tap - 0.07, T.tap, t) * (1 - sstep(T.tap + 0.08, T.tap + 0.2, t)), tap: T.tap };
}

// ───────────────────────── helpers ─────────────────────────
function txt(s, x, y, font, color, { align = 'left', op = 1, sx = 1, sy = 1, dy = 0, base = 'alphabetic', track = 0 } = {}) {
  if (op <= 0.003) return;
  g.save(); g.globalAlpha *= clamp(op); g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  if (track) g.letterSpacing = track + 'px';
  g.translate(x, y + dy); g.scale(sx, sy); g.fillText(s, 0, 0); g.restore();
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function card(x, y, w, h, r, op, fill = C.card, shadow = true) {
  if (op <= 0.003) return;
  g.save(); g.globalAlpha *= op;
  if (shadow) { g.shadowColor = 'rgba(0,12,10,0.45)'; g.shadowBlur = 50 * DPR * CAM.zoom; g.shadowOffsetY = 20 * DPR * CAM.zoom; }
  rrect(x, y, w, h, r); g.fillStyle = fill; g.fill(); g.restore();
}
function chip(s, x, y, font, fg, bg, op = 1, sc = 1, padX = 18, h = 52) {
  if (op <= 0.003) return 0;
  g.save(); g.font = font; const w = g.measureText(s).width + padX * 2; g.globalAlpha *= op;
  g.translate(x, y); g.scale(sc, sc); rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = bg; g.fill();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, 0, 2); g.restore(); return w;
}
function head(s, x, y, font, color, tIn, tOut, t, opts = {}) {
  if (t < tIn || t > tOut + 0.3) return;
  const r = OM.wordRise(t, tIn, { dist: 34, omega: 20 }), o = OM.liftOut(t, tOut, { dur: 0.24, dist: 60 });
  txt(s, x, y, font, color, { ...opts, op: r.op * o.op, dy: r.y + o.dy, sx: r.s * o.s, sy: r.s * o.s });
}
const W_ = (s, font) => { g.save(); g.font = font; const w = g.measureText(s).width; g.restore(); return w; };
const check = (x, y, s, col, lw = 4) => { g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - 9 * s, y); g.lineTo(x - 2 * s, y + 7 * s); g.lineTo(x + 10 * s, y - 7 * s); g.stroke(); g.restore(); };
const mul = (A, Bm) => [A[0] * Bm[0] + A[2] * Bm[1], A[1] * Bm[0] + A[3] * Bm[1], A[0] * Bm[2] + A[2] * Bm[3], A[1] * Bm[2] + A[3] * Bm[3], A[0] * Bm[4] + A[2] * Bm[5] + A[4], A[1] * Bm[4] + A[3] * Bm[5] + A[5]];

// ───────────────────────── seek ─────────────────────────
let CAM, VIEW, TRK = {};
const setM = M => g.setTransform(M[0] * DPR, M[1] * DPR, M[2] * DPR, M[3] * DPR, M[4] * DPR, M[5] * DPR);
function seek(t) {
  t = clamp(t, 0, DUR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalAlpha = 1; g.fillStyle = C.ground; g.fillRect(0, 0, W, H);
  CAM = camAt(t); VIEW = OM.view(CAM, { W, H });
  const G = OM.lattice(CAM, { depth: 1.2, spacing: 54, px: 2.2, W, H }); setM(G.matrix);
  g.fillStyle = C.dot; g.globalAlpha = 0.9; g.beginPath();
  for (let x = G.x0; x <= G.x1; x += G.spacing) for (let y = G.y0; y <= G.y1; y += G.spacing) { g.moveTo(x + G.r, y); g.arc(x, y, G.r, 0, 6.2832); }
  g.fill(); g.globalAlpha = 1;
  setM(VIEW);
  drawPile(t);
  drawChat(t);
  drawChart(t);
  setM(VIEW);
  drawCards(t);
  drawBeam(t);
  drawFinger(t);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawEnd(t);
  drawHeadlines(t);
  if (Q.has('safe')) drawSafe();
  return true;
}

function drawBeam(t) {
  const b = beamAt(t); TRK.beam = b; if (!b || b.op <= 0) return;
  const P = b.P, path = () => { g.beginPath(); g.moveTo(P[0][0], P[0][1]); for (let i = 1; i < N; i++) g.lineTo(P[i][0], P[i][1]); };
  g.save(); g.globalAlpha = b.op; g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = C.beam; g.lineWidth = 6; path(); g.stroke();   // the identity stroke first
  g.globalAlpha = b.op * 0.22; g.lineWidth = 26; path(); g.stroke();
  g.globalAlpha = b.op * 0.10; g.lineWidth = 60; path(); g.stroke();
  g.globalAlpha = b.op; g.strokeStyle = '#EFFFF7'; g.lineWidth = 2.5; path(); g.stroke();
  g.restore();
}

function drawInvoice(x, y, w, h, full, t, scanned) {
  rrect(x, y, w, h, 14); g.fillStyle = C.paper; g.fill();
  if (!full) {   // the pile: generic invoices
    txt('INVOIS', x + 40, y + 80, F.sans(800, 38), '#C9C2B4');
    for (let i = 0; i < 9; i++) { g.fillStyle = '#E6E0D3'; g.fillRect(x + 40, y + 140 + i * 58, w * (0.35 + 0.4 * Math.abs(Math.sin(i * 1.7 + x))), 14); g.fillRect(x + w - 150, y + 140 + i * 58, 110, 14); }
    return;
  }
  txt('INVOIS', x + 40, y + 90, F.sans(800, 46), C.ink);
  txt('Syarikat Maju Jaya Sdn Bhd', x + 40, y + 205, F.sans(800, 30), C.ink);
  txt('No. INV-20931', x + 40, y + 266, F.sans(700, 26), C.mute);
  txt('03/11/2026', x + 380, y + 266, F.sans(700, 26), C.mute);
  g.fillStyle = C.line; g.fillRect(x + 40, y + 310, w - 80, 3);
  [['Kertas A4 (50 rim)', '1,250.00'], ['Toner pencetak', '2,180.00'], ['Penghantaran', '1,100.80']].forEach((r, i) => {
    txt(r[0], x + 40, y + 380 + i * 66, F.sans(700, 26), C.ink); txt(r[1], x + w - 40, y + 380 + i * 66, F.sans(700, 26), C.ink, { align: 'right' });
  });
  g.fillStyle = C.line; g.fillRect(x + 40, y + 600, w - 80, 3);
  txt('JUMLAH', x + 40, y + 682, F.sans(800, 26), C.mute, { track: 2 });
  txt('RM 4,820.80', x + w - 40, y + 684, F.sans(800, 44), C.ink, { align: 'right' });
  // fields light up as the beam passes them
  FIELDS.forEach(f => {
    const passed = scanned(y + f.y + f.h / 2); if (passed <= 0) return;
    g.save(); g.globalAlpha = passed; g.strokeStyle = C.teal; g.lineWidth = 4; rrect(x + f.x - 10, y + f.y - 8, f.w + 20, f.h + 16, 10); g.stroke();
    g.fillStyle = 'rgba(127,216,176,0.16)'; g.fill(); g.restore();
  });
}

function drawPile(t) {
  if (t > T.inChat + 0.3) return;
  const rapidI = t < T.rapid ? -1 : Math.min(5, Math.floor((t - T.rapid) / ((T.rapidEnd - T.rapid) / 5)));
  for (let i = PILE.length - 1; i >= 0; i--) { const p = PILE[i];   // i = 0 is the top invoice; draw bottom first
    const k = spring(t - p.t, 0.55, 16), land = OM.impact(t, p.t + 0.12, { sqx: 0.04, sqy: 0.05 });
    if (k <= 0) continue;
    // in the rapid scan the top invoices fly off to the left, one per sweep, stamped
    const per = (T.rapidEnd - T.rapid) / 5, tGo = i === 0 ? T.rapid : T.rapid + per * i, gone = i <= 5 ? ease.expoIn(seg(t, tGo - 0.02, tGo + 0.22)) : 0;
    if (gone >= 1) continue;
    const x = INV.x + p.dx * (1 - (i === 0 ? 1 : 0)) - gone * 900, y = INV.y + p.dy * (i === 0 ? 0 : 1) - (1 - k) * 1500 + gone * -120;
    const rot = (i === 0 ? 0 : p.rot) - gone * 0.3;
    g.save(); g.translate(x + INV.w / 2, y + INV.h / 2); g.rotate(rot); g.scale(land.sx, land.sy); g.translate(-INV.w / 2, -INV.h / 2);
    g.shadowColor = 'rgba(0,12,10,0.4)'; g.shadowBlur = 40 * DPR; g.shadowOffsetY = 14 * DPR; rrect(0, 0, INV.w, INV.h, 14); g.fillStyle = C.paper; g.fill(); g.shadowColor = 'transparent';
    const bY = beamAt(t) && t >= T.beamIn ? beamAt(t).P[0][1] : -1;
    const isTop = i === 0 || (rapidI >= 0 && i === rapidI);
    drawInvoice(0, 0, INV.w, INV.h, i === 0, t, yy => (i === 0 && t >= T.scan) ? sstep(yy - 10, yy + 30, t < T.scanned ? bY - y : 1e9) : 0);
    if (gone > 0 || (i === 0 && t >= T.scanned)) {   // the stamp
      const st = OM.popIn(t, i === 0 ? T.scanned : tGo - 0.12, { s0: 1.4, ds: -0.4, rise: 0 });
      g.save(); g.translate(INV.w - 170, INV.h - 230); g.rotate(-0.18); g.scale(st.s, st.s); g.globalAlpha = st.op;
      g.strokeStyle = C.teal; g.lineWidth = 6; rrect(-130, -40, 260, 80, 12); g.stroke();
      txt('✓ DIREKOD', 0, 14, F.sans(800, 36), C.teal, { align: 'center', track: 2 }); g.restore();
    }
    g.restore();
  }
  // extracted fields pop out on the right as the beam reads them
  if (t >= T.scan && t < T.rapid + 0.2) {
    const out = 1 - sstep(T.rapid - 0.1, T.rapid + 0.15, t);
    FIELDS.forEach((f, i) => {
      const tf = lerp(T.scan, T.scanned, (f.y + f.h / 2 - 40) / (INV.h - 80)) + 0.05, p = OM.popIn(t, tf, { s0: 0.7, ds: 0.3 });
      chip(f.label + ' ✓', 760, INV.y + 140 + i * 74 + p.dy, F.sans(800, 26), C.deep, C.mint, p.op * out, p.s, 20, 54);
    });
  }
}

function drawChat(t) {
  if (t < T.toChat || t > T.inD + 0.2) return;
  const p = OM.popIn(t, T.toChat + 0.35, { rise: 0, s0: 0.97 }), fade = 1 - sstep(T.dive + 0.1, T.dived - 0.15, t);   // the chat falls away as we dive into its chart
  if (fade <= 0) return;
  g.save(); g.globalAlpha = fade;
  card(CHAT.x, CHAT.y, CHAT.w, CHAT.h, 34, p.op, C.cream, true);
  g.globalAlpha = fade * p.op;
  // header
  g.beginPath(); g.arc(CHAT.x + 60, CHAT.y + 60, 30, 0, 6.2832); g.fillStyle = C.teal; g.fill();
  txt('AI', CHAT.x + 60, CHAT.y + 70, F.sans(800, 26), '#fff', { align: 'center' });
