<!DOCTYPE html>

<title>Rungkai Kusut · Satu borang</title>
<link rel="stylesheet" href="fonts.css">

</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="motion.js"></script>
<script>
'use strict';
const { clamp, lerp, seg, sstep, ssstep, ease, spring, spline } = OM;
const W = 1080, H = 1920, DUR = 22;
const SAFE = { x0: 72, x1: 930, y0: 250, y1: 1440 };   // TikTok + Reels shared safe zone
const CX = (SAFE.x0 + SAFE.x1) / 2;
const C = {
  ground: '#13203B', ground2: '#1B2A4A', dot: '#2E3D63', cream: '#F4EFE5', paper: '#FBF8F2', card: '#FFFFFF',
  ink: '#1B2A4A', mute: '#5D6782', soft: '#B9C2DA', line: '#E3DCCD', amber: '#F2B544', amberD: '#C98A12',
  mint: '#7FD8B0', teal: '#1E7A6C', tealL: '#E1F1EE', pink: '#E46F92', pinkD: '#C2456B', pinkL: '#FBE7EE', bezel: '#C9D1E3',
  link: '#f2b545',   // the one stroke that carries the film (token path / system links)
};
const F = { sans: (w, px) => `${w} ${px}px Jakarta`, serif: px => `400 ${px}px Serif`, ital: px => `italic 400 ${px}px Serif` };
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const DPR = window.devicePixelRatio || 1; cv.width = W * DPR; cv.height = H * DPR;

// ───────────────────────── timeline ─────────────────────────
const T = {
  q1: 0.1, q2: 0.4, tapPaper: 2.2, fold: 2.35, folded: 3.0, head2: 2.6, sub2: 3.3,
  tapChip: 3.55, tapAmt: 4.05, type: 4.15, tapUp: 4.95, aiRead: 5.45, tapSend: 6.0,
  shrink: 6.12, hop: 6.55, land: 7.15, wfHead: 7.0, stat: 9.05, rest: 9.35,
  toC: 10.3, inC: 10.95, cHead: 10.6, cSub: 11.5,
  pull: 12.55, pulled: 13.3, chips: 13.05, push: 14.3, pushed: 15.1,
  calcHead: 15.1, calc: 15.1, result: 15.7, tapCalc: 16.85, iris: 17.0, irisEnd: 17.7, end: 17.75,
};
const NODE_T = [7.15, 7.7, 8.25, 8.8];
const BUBBLES = [
  { who: 'Aina', s: 'Boss, dah approve claim?', x: 300, y: 700, r: -0.04, t: 0.25 },
  { who: 'Hafiz', s: 'Resit hilang lah…', x: 700, y: 820, r: 0.05, t: 0.55 },
  { who: 'Boss', s: 'Borang mana satu?', x: 310, y: 1010, r: 0.03, t: 0.85 },
  { who: 'Finance', s: 'Tolong sign cepat!', x: 700, y: 1140, r: -0.05, t: 1.1 },
  { who: 'Aina', s: 'Dah 3 hari tunggu…', x: 320, y: 1300, r: -0.02, t: 1.35 },
  { who: 'Mei Ling', s: 'Saya taip semula ke?', x: 690, y: 1400, r: 0.04, t: 1.6 },
];
// stations in the world: A phone (x 0–1080), B workflow (1100–2180), C system (2200–3280)
const PH = { x: 298, y: 610, w: 406, h: 830, r: 58 }, SC = { x: 311, y: 623, w: 380, h: 804, r: 46 };
const PAPER = { x: 270, y: 640, w: 470, h: 640 };
const PILL = { x: 336, y: 1125, w: 330, h: 72, r: 36 };
const BX = 1262, NODES = [
  { y: 720, who: 'Aina · Staf', st: 'Dihantar', tm: '9:02 pg' },
  { y: 920, who: 'En. Razak · Pengurus', st: 'Diluluskan ✓', tm: '9:03 pg' },
  { y: 1120, who: 'Kewangan', st: 'Disemak ✓', tm: '9:04 pg' },
  { y: 1320, who: 'Sistem', st: 'Dibayar ✓', tm: '9:05 pg' },
];
const PANEL = { x: 2272, y: 600, w: 858, h: 640 };
const ROWS = [['#0142', 'Aina', '86.40', 'Dibayar'], ['#0141', 'Hafiz', '32.00', 'Lulus'], ['#0140', 'Mei Ling', '120.00', 'Disemak'], ['#0139', 'Ravi', '54.20', 'Dibayar'], ['#0138', 'Siti', '18.90', 'Dibayar']];
const ROW_Y = i => 775 + i * 88;
const CHIPS = [
  { s: 'Akaun', x: 760, y: 1760 }, { s: 'Gaji', x: 1640, y: 1760 }, { s: 'Bank', x: 2520, y: 1760 },
  { s: 'Stok', x: 840, y: 2160 }, { s: 'CRM', x: 1640, y: 2160 }, { s: 'Kedai online', x: 2440, y: 2160 },
];
const HUB = [1640, 1500];
const CALC = { x: 2272, y: 1480, w: 858, h: 640 };
const CAM_CALC = { x: 2740, y: 1760 };

// ───────────────────────── camera ─────────────────────────
const KEYS = [
  { t: 0, x: 540, y: 1000, zoom: 1.06 },
  { t: 2.2, x: 530, y: 990, zoom: 1.03, curve: ease.sineInOut },
  { t: 3.0, x: 540, y: 980, zoom: 1.0, curve: ease.cubicInOut },
  { t: 3.45, x: 540, y: 1060, zoom: 1.14, curve: ease.cubicInOut },     // leans in while the finger fills the form
  { t: 6.05, x: 540, y: 1060, zoom: 1.14 },
  { t: 6.45, x: 540, y: 1000, zoom: 1.0, curve: ease.cubicInOut },
  { t: 7.15, x: 1640, y: 960, zoom: 1.0, curve: ease.expoInOut },        // whips with the token
  { t: 8.9, x: 1640, y: 975, zoom: 1.0, curve: ease.sineInOut },        // rides down the chain
  { t: 10.3, x: 1640, y: 975, zoom: 1.0 },
  { t: 10.95, x: 2740, y: 960, zoom: 1.0, curve: ease.expoInOut },
  { t: 12.55, x: 2740, y: 960, zoom: 1.0 },
  { t: 13.3, x: 1640, y: 1240, zoom: 0.34, curve: ease.cubicInOut },     // pull back: one system
  { t: 14.3, x: 1640, y: 1240, zoom: 0.34 },
  { t: 15.1, x: CAM_CALC.x, y: CAM_CALC.y, zoom: 1.0, curve: ease.expoInOut },
];
const HITS = [[0.85, 4, 10], [1.6, 4, 10], [3.0, 6, 9], [6.0, 5, 10], [7.15, 7, 9], [8.8, 5, 10], [10.95, 7, 9], [13.3, 6, 9], [15.1, 6, 9], [16.4, 6, 9]];
const handEnv = t => sstep(0.05, 0.4, t) * (1 - sstep(1.9, 2.3, t)) + sstep(7.3, 7.6, t) * (1 - sstep(8.7, 9.1, t)) + sstep(11.1, 11.4, t) * (1 - sstep(12.2, 12.5, t));
function camAt(t) {
  const c = OM.camera(t, KEYS, { W, H }), e = handEnv(t) * 4.5;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom, y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom, rot = c.rot;
  for (const [th, amp, decay] of HITS) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  return { x, y, zoom: c.zoom, rot };
}

// ───────────────────────── the finger ─────────────────────────
const FING = [
  { t: 1.75, x: 1000, y: 1560 }, { t: T.tapPaper, x: 560, y: 1040 }, { t: 2.9, x: 900, y: 1300 },
  { t: T.tapChip, x: 400, y: 815 }, { t: T.tapAmt, x: 560, y: 925 }, { t: 4.6, x: 640, y: 1000 }, { t: T.tapUp, x: 500, y: 1120 },
  { t: 5.5, x: 820, y: 1250 }, { t: T.tapSend, x: 520, y: 1340 }, { t: 6.5, x: 1000, y: 1600 },
];
const TAPS = [T.tapPaper, T.tapChip, T.tapAmt, T.tapUp, T.tapSend];
const FING2 = [{ t: 16.3, x: CAM_CALC.x + 470, y: CAM_CALC.y + 640 }, { t: T.tapCalc, x: CAM_CALC.x + 60, y: CAM_CALC.y + 330 }, { t: 17.3, x: CAM_CALC.x + 60, y: CAM_CALC.y + 330 }];
function finger(t) {
  let K, taps, op;
  if (t > 1.75 && t < 6.5) { K = FING; taps = TAPS; op = sstep(1.75, 2.0, t) * (1 - sstep(6.15, 6.45, t)); }
  else if (t > 16.3 && t < 17.3) { K = FING2; taps = [T.tapCalc]; op = sstep(16.3, 16.5, t) * (1 - sstep(17.05, 17.25, t)); }
  else return null;
  const p = spline(K, t); let down = 0, tap = -9;
  for (const c of taps) { down = Math.max(down, sstep(c - 0.07, c, t) * (1 - sstep(c + 0.08, c + 0.2, t))); if (t >= c) tap = c; }
  return { x: p[0], y: p[1], op, down, tap };
}

// ───────────────────────── helpers ─────────────────────────
function txt(s, x, y, font, color, { align = 'left', op = 1, sx = 1, sy = 1, dy = 0, base = 'alphabetic', track = 0 } = {}) {
  if (op <= 0.003) return;
  g.save(); g.globalAlpha *= clamp(op); g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  if (track) g.letterSpacing = track + 'px';
  g.translate(x, y + dy); g.scale(sx, sy); g.fillText(s, 0, 0); g.restore();
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function card(x, y, w, h, r, op, fill = C.card, shadow = true) {
  if (op <= 0.003) return;
  g.save(); g.globalAlpha *= op;
  if (shadow) { g.shadowColor = 'rgba(5,10,25,0.45)'; g.shadowBlur = 50 * DPR * CAM.zoom; g.shadowOffsetY = 20 * DPR * CAM.zoom; }
  rrect(x, y, w, h, r); g.fillStyle = fill; g.fill(); g.restore();
}
function chip(s, x, y, font, fg, bg, op = 1, sc = 1, padX = 18, h = 52) {
  if (op <= 0.003) return 0;
  g.save(); g.font = font; const w = g.measureText(s).width + padX * 2; g.globalAlpha *= op;
  g.translate(x, y); g.scale(sc, sc); rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = bg; g.fill();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, 0, 2); g.restore(); return w;
}
function head(s, x, y, font, color, tIn, tOut, t, opts = {}) {
  if (t < tIn || t > tOut + 0.3) return;
  const r = OM.wordRise(t, tIn, { dist: 34, omega: 20 }), o = OM.liftOut(t, tOut, { dur: 0.24, dist: 60 });
  txt(s, x, y, font, color, { ...opts, op: r.op * o.op, dy: r.y + o.dy, sx: r.s * o.s, sy: r.s * o.s });
}
const W_ = (s, font) => { g.save(); g.font = font; const w = g.measureText(s).width; g.restore(); return w; };
const check = (x, y, s, col = '#fff', lw = 4) => { g.save(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - 9 * s, y); g.lineTo(x - 2 * s, y + 7 * s); g.lineTo(x + 10 * s, y - 7 * s); g.stroke(); g.restore(); };

// ───────────────────────── the token: the claim itself, carried from the phone to the system ─────────────────────────
function tokenAt(t) {
  if (t < T.shrink || t >= T.inC + 0.4) return null;
  if (t < T.hop) { const m = OM.morphRect(t, T.shrink, T.hop - 0.05, { ...SC }, PILL, { curve: ease.expoOut }); return { ...m, k: m.k, phase: 'shrink' }; }
  const P = (x, y, w = PILL.w) => ({ x: x - w / 2, y: y - PILL.h / 2, w, h: PILL.h, r: 36 });
  const BEAD = 72;   // on the chain the claim is a bead on the line; it opens back into the pill for the system
  if (t < T.land) { const h = OM.hop(t, T.hop, T.land, { x: PILL.x + PILL.w / 2, y: PILL.y + PILL.h / 2 }, { x: BX, y: NODES[0].y }, { height: 260 }); return { ...P(h.x, h.y, lerp(PILL.w, BEAD, ease.cubicInOut(h.k))), phase: 'fly' }; }
  if (t < T.toC) {   // down the chain, landing on each node with a spring
    let y = NODES[0].y;
    for (let i = 1; i < 4; i++) { const k = spring(t - (NODE_T[i] - 0.32), 0.62, 16); y = lerp(y, NODES[i].y, k); }
    return { ...P(BX, y, BEAD), phase: 'chain' };
  }
  if (t < T.inC) { const h = OM.hop(t, T.toC, T.inC, { x: BX, y: NODES[3].y }, { x: PANEL.x + PANEL.w / 2, y: ROW_Y(0) - 12 }, { height: 320 }); return { ...P(h.x, h.y, lerp(BEAD, PILL.w, ease.cubicInOut(h.k))), phase: 'fly' }; }
  const m = OM.morphRect(t, T.inC, T.inC + 0.35, P(PANEL.x + PANEL.w / 2, ROW_Y(0) - 12), { x: PANEL.x + 16, y: ROW_Y(0) - 52, w: PANEL.w - 32, h: 80, r: 18 }, { curve: ease.expoOut });
  return { ...m, phase: 'row' };
}

// ───────────────────────── seek ─────────────────────────
let CAM, VIEW, TRK = {};
function seek(t) {
  t = clamp(t, 0, DUR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalAlpha = 1; g.fillStyle = C.ground; g.fillRect(0, 0, W, H);
  CAM = camAt(t); VIEW = OM.view(CAM, { W, H });
  const setM = M => g.setTransform(M[0] * DPR, M[1] * DPR, M[2] * DPR, M[3] * DPR, M[4] * DPR, M[5] * DPR);
  const G = OM.lattice(CAM, { depth: 1.2, spacing: 54, px: 2.2, W, H }); setM(G.matrix);
  g.fillStyle = C.dot; g.globalAlpha = 0.9; g.beginPath();
  for (let x = G.x0; x <= G.x1; x += G.spacing) for (let y = G.y0; y <= G.y1; y += G.spacing) { g.moveTo(x + G.r, y); g.arc(x, y, G.r, 0, 6.2832); }
  g.fill(); g.globalAlpha = 1;
  setM(VIEW);

  drawLinks(t);
  drawPhone(t);
  drawWorkflow(t);
  drawSystem(t);
  drawCalc(t);
  const tk = tokenAt(t); TRK.token = tk;
  if (tk) drawToken(t, tk);
  drawFinger(t);

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawIrisAndEnd(t);
  drawHeadlines(t);
  if (Q.has('safe')) drawSafe();
  return true;
}

function drawLinks(t) {   // the system's wiring: the token's road, then every integration — one stroke style
  if (t < T.pull + 0.2 || t > T.push + 0.5) return;
  const k = ease.cubicOut(seg(t, T.pull + 0.2, T.pulled)), op = 1 - sstep(T.push, T.push + 0.4, t);
  const road = [[PH.x + PH.w, 1020], [BX, NODES[0].y], [BX, NODES[3].y], [PANEL.x, PANEL.y + 320]];
  g.save(); g.globalAlpha = op; g.strokeStyle = C.link; g.lineWidth = 14; g.lineCap = 'round'; g.setLineDash([2, 34]);
  g.beginPath(); g.moveTo(...road[0]);
  for (let i = 1; i < road.length; i++) { const a = road[i - 1], b = road[i], u = clamp(k * 3 - (i - 1)); g.lineTo(lerp(a[0], b[0], u), lerp(a[1], b[1], u)); }
  g.stroke(); g.setLineDash([]);
  CHIPS.forEach((c, i) => {
    const tc = T.chips + i * 0.14, u = ease.expoOut(seg(t, tc - 0.12, tc + 0.1)); if (u <= 0) return;
    g.lineWidth = 10; g.globalAlpha = op * 0.85; g.beginPath(); g.moveTo(...HUB); g.lineTo(lerp(HUB[0], c.x, u), lerp(HUB[1], c.y, u)); g.stroke();
  });
  g.restore();
  // hub
  const hk = OM.popIn(t, T.chips - 0.2);
  g.save(); g.globalAlpha = op * hk.op; g.beginPath(); g.arc(HUB[0], HUB[1], 70 * hk.s, 0, 6.2832); g.fillStyle = C.amber; g.fill(); g.restore();
  CHIPS.forEach((c, i) => {
    const tc = T.chips + i * 0.14, p = OM.popIn(t, tc, { s0: 0.6, ds: 0.4 }), im = OM.impact(t, tc + 0.05, { sqx: 0.08, sqy: 0.1 });
    chip(c.s, c.x, c.y + p.dy * 3, F.sans(800, 84), C.ink, C.cream, p.op * op, p.s * im.sx, 48, 160);
  });
}

function drawPhone(t) {
  if (t > T.pushed) return;
  // the paper → the phone: one container that changes what it is
  const k = ease.expoInOut(seg(t, T.fold, T.folded));
  const rot = lerp(-0.06, 0, k), x = lerp(PAPER.x, PH.x, k), y = lerp(PAPER.y, PH.y, k), w = lerp(PAPER.w, PH.w, k), h = lerp(PAPER.h, PH.h, k), r = lerp(6, PH.r, k);
  const tap = OM.press(t, T.tapPaper, { depth: 0.05 }), cxp = x + w / 2, cyp = y + h / 2;
  g.save(); g.translate(cxp, cyp); g.rotate(rot); g.scale(tap.s, tap.s); g.translate(-cxp, -cyp);
  const pin = OM.popIn(t, 0, { rise: 0, s0: 0.98 });
  card(x, y, w, h, r, pin.op, k < 0.5 ? C.paper : C.bezel, true);
  if (k > 0.5) { g.save(); g.globalAlpha = clamp((k - 0.5) * 4); rrect(x + w / 2 - 50, y + 22, 100, 10, 5); g.fillStyle = '#9AA6C4'; g.fill(); g.restore(); }
  if (k > 0.45) { g.globalAlpha = clamp((k - 0.45) * 3); rrect(SC.x + (x - PH.x), SC.y + (y - PH.y), w - 26, h - 26, r - 12); g.fillStyle = C.paper; g.fill(); g.globalAlpha = 1; }
  // paper face: a form filled by hand, stamped MENUNGGU
  const pf = 1 - sstep(0.15, 0.5, k);
  if (pf > 0) {
    g.save(); g.globalAlpha = pf;
    txt('BORANG TUNTUTAN', x + 40, y + 72, F.sans(800, 30), C.ink, { track: 2 });
    for (let i = 0; i < 7; i++) {
      const ly = y + 140 + i * 62; g.strokeStyle = C.line; g.lineWidth = 3; g.beginPath(); g.moveTo(x + 40, ly); g.lineTo(x + w - 40, ly); g.stroke();
      g.strokeStyle = '#4A5A86'; g.lineWidth = 3; g.beginPath();
      for (let j = 0; j <= 30; j++) { const u = j / 30, xx = x + 60 + u * (w - 120) * (0.45 + 0.4 * Math.abs(Math.sin(i * 2.3))); g.lineTo(xx, ly - 14 + 7 * Math.sin(u * 22 + i)); }
      g.stroke();
    }
    g.save(); g.translate(x + w - 150, y + h - 90); g.rotate(-0.22); g.strokeStyle = C.pinkD; g.lineWidth = 5; rrect(-120, -36, 240, 72, 10); g.stroke();
    txt('MENUNGGU', 0, 13, F.sans(800, 36), C.pinkD, { align: 'center', track: 3 }); g.restore();
    g.restore();
  }
  g.restore();
  if (k < 0.9 || t > T.hop + 0.2) { drawBubbles(t); return; }
  // the app (a claim form), filled by the finger
  const ui = sstep(T.folded - 0.15, T.folded + 0.15, t) * (1 - sstep(T.shrink, T.shrink + 0.15, t));
  if (ui <= 0) return;
  g.save(); g.globalAlpha = ui; const L = SC.x + 22;
  txt('9:41', L, SC.y + 36, F.sans(700, 20), C.ink);
  txt('Tuntutan Baru', L, SC.y + 98, F.sans(800, 36), C.ink);
  txt('JENIS', L, SC.y + 150, F.sans(800, 21), C.mute, { track: 2 });
  let cx = L; ['Perjalanan', 'Makan', 'Lain'].forEach((s, i) => {
    const on = i === 0 && t >= T.tapChip, pr = i === 0 ? OM.press(t, T.tapChip, { depth: 0.1 }) : { s: 1 };
    const w = W_(s, F.sans(700, 24)) + 28;
    g.save(); g.translate(cx + w / 2, SC.y + 190); g.scale(pr.s, pr.s); rrect(-w / 2, -24, w, 48, 24); g.fillStyle = on ? C.teal : C.cream; g.fill();
    if (!on) { g.strokeStyle = C.line; g.lineWidth = 2; g.stroke(); }
    txt(s, 0, 9, F.sans(700, 24), on ? '#fff' : C.ink, { align: 'center' }); g.restore(); cx += w + 10;
  });
  txt('JUMLAH (RM)', L, SC.y + 262, F.sans(800, 21), C.mute, { track: 2 });
  rrect(L, SC.y + 278, SC.w - 44, 76, 16); g.fillStyle = C.card; g.fill(); g.strokeStyle = t >= T.tapAmt && t < T.tapUp ? C.teal : C.line; g.lineWidth = 3; g.stroke();
  const ty = OM.typeOn(t, T.type, '86.40', { cps: 11 });
  txt(t >= T.type ? ty.str : '0.00', L + 22, SC.y + 330, F.sans(800, 40), t >= T.type ? C.ink : '#C9C2B4');
  if (t >= T.tapAmt && t < T.tapUp && ty.caret) { const cw = W_(ty.str, F.sans(800, 40)); g.fillStyle = C.teal; g.fillRect(L + 24 + cw, SC.y + 296, 3, 40); }
  txt('RESIT', L, SC.y + 398, F.sans(800, 21), C.mute, { track: 2 });
  const UP = { x: L, y: SC.y + 414, w: SC.w - 44, h: 250 };
  g.save(); rrect(UP.x, UP.y, UP.w, UP.h, 18); g.fillStyle = C.cream; g.fill(); g.setLineDash([10, 8]); g.strokeStyle = '#C9C2B4'; g.lineWidth = 3; g.stroke(); g.restore();
  if (t < T.tapUp + 0.05) { txt('+ Ambil gambar resit', UP.x + UP.w / 2, UP.y + UP.h / 2 + 8, F.sans(700, 26), C.mute, { align: 'center' }); }
